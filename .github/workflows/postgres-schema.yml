name: PostgreSQL schema safety

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  postgres-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: themisiq_test_policy_schema
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d themisiq_test_policy_schema"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/themisiq_test_policy_schema
      THEMISIQ_ALLOW_DESTRUCTIVE_PG_TESTS: "1"
      DEBUG: "true"
      SECRET_KEY: ci-only-not-for-production-themisiq-postgres-schema

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: oneforall/requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r oneforall/requirements-dev.txt
      # PLAN-36 T09: extended (2026-09-30) with T03 (erm_risk_library.org_id),
      # T04 (warm_replay.py query fixes), and F14 (evidence_items.org_id +
      # RLS policy) real-Postgres cases -- all inside this same file's `pg`
      # fixture, which this one pytest invocation already picks up.
      - name: Verify PostgreSQL initialization and upgrades
        run: python -m pytest -q oneforall/tests/test_postgres_init.py
