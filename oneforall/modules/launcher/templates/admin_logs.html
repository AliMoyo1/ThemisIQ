{% extends "platform_base.html" %}
{% block title %}Audit Log — ThemisIQ{% endblock %}
{% block content %}

<div class="topbar">
  <span class="page-title">Platform Audit Log</span>
  <div class="topbar-actions">
    <button id="exportLogs" class="btn btn-secondary" title="Export filtered logs as CSV">
      ⬇ Export CSV
    </button>
  </div>
</div>

<div class="content">

  <!-- Filters -->
  <div class="card" data-s="s7da4293">
    <div data-s="sf7d9abe" data-sd="flex">
      <div data-s="saae0403">
        <label data-s="s3f77a9a" data-sd="block">Module</label>
        <select id="filterModule" data-s="s6f540d7">
          <option value="">All Modules</option>
        </select>
      </div>
      <div data-s="saae0403">
        <label data-s="s3f77a9a" data-sd="block">Action</label>
        <input id="filterAction" type="text" placeholder="Filter by action..." data-s="s6f540d7">
      </div>
      <div data-s="saae0403">
        <label data-s="s3f77a9a" data-sd="block">User</label>
        <input id="filterUser" type="text" placeholder="Filter by user..." data-s="s6f540d7">
      </div>
      <div data-s="saae0403">
        <label data-s="s3f77a9a" data-sd="block">From</label>
        <input id="filterFrom" type="date" data-s="s6f540d7">
      </div>
      <div data-s="saae0403">
        <label data-s="s3f77a9a" data-sd="block">To</label>
        <input id="filterTo" type="date" data-s="s6f540d7">
      </div>
      <div>
        <button id="clearLogFilters" class="btn btn-secondary" data-s="sdfcfdd4">Clear</button>
      </div>
    </div>
  </div>

  <!-- Quick Filters -->
  <div data-s="sf9eb253" data-sd="flex">
    <button class="btn btn-secondary log-preset" data-preset="login_failed" data-s="s9338cb0">Login Failures</button>
    <button class="btn btn-secondary log-preset" data-preset="delete" data-s="s9338cb0">Deletions</button>
    <button class="btn btn-secondary log-preset" data-preset="export" data-s="s9338cb0">Exports</button>
    <button class="btn btn-secondary log-preset" data-preset="create" data-s="s9338cb0">Creations</button>
    <button class="btn btn-secondary log-preset" data-preset="today" data-s="s9338cb0">Today</button>
    <button class="btn btn-secondary log-preset" data-preset="week" data-s="s9338cb0">This Week</button>
  </div>

  <!-- Log Table -->
  <div class="card" data-s="s22a2674">
    <div id="logTableWrap" data-s="s0ddf068">
      <table data-s="sa45600e">
        <thead>
          <tr data-s="s1008415">
            <th data-s="s1135550">Timestamp</th>
            <th data-s="s4050279">User</th>
            <th data-s="s4050279">Module</th>
            <th data-s="s4050279">Action</th>
            <th data-s="s4050279">Details</th>
            <th data-s="s4050279">IP</th>
          </tr>
        </thead>
        <tbody id="logBody">
          <tr><td colspan="6" data-s="sc0add8c">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Pagination -->
  <div id="pagination" data-s="s1701e60" data-sd="flex">
    <span id="pageInfo" data-s="s7fc448e"></span>
    <div data-s="sf0abc1d" data-sd="flex">
      <button id="btnPrev" class="btn btn-secondary" data-s="s831e0bd" disabled>← Prev</button>
      <button id="btnNext" class="btn btn-secondary" data-s="s831e0bd" disabled>Next →</button>
    </div>
  </div>

</div>

<script src="/static/js/admin_logs.js" defer></script>

{% endblock %}
