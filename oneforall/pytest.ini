[pytest]
testpaths = tests
addopts = -q --tb=short
filterwarnings =
    ignore::DeprecationWarning:apscheduler.*
markers =
    expected_page_errors(reason): this UI test deliberately exercises a console/page-error or failed-request path as its documented subject; opts out of the autouse zero-page-errors gate in tests/ui/conftest.py (PLAN-36 T08).
