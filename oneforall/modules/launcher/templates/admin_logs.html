{% extends "platform_base.html" %}
{% block title %}Audit Log — ThemisIQ{% endblock %}
{% block content %}

<div class="topbar">
  <span class="page-title">Platform Audit Log</span>
  <div class="topbar-actions">
    <button id="exportLogs" class="btn btn-secondary" title="Export filtered logs as CSV">
      ⬇ Export CSV
    </button>
  </div>
</div>

<div class="content">

  <!-- Filters -->
  <div class="card" style="padding:16px 20px; margin-bottom:16px;">
    <div style="display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end;">
      <div style="flex:1; min-width:140px;">
        <label style="font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted); display:block; margin-bottom:4px;">Module</label>
        <select id="filterModule" style="width:100%; padding:8px 10px; border-radius:6px; border:1px solid var(--border); background:var(--surface2); color:var(--text); font-size:13px;">
          <option value="">All Modules</option>
        </select>
      </div>
      <div style="flex:1; min-width:140px;">
        <label style="font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted); display:block; margin-bottom:4px;">Action</label>
        <input id="filterAction" type="text" placeholder="Filter by action..." style="width:100%; padding:8px 10px; border-radius:6px; border:1px solid var(--border); background:var(--surface2); color:var(--text); font-size:13px;">
      </div>
      <div style="flex:1; min-width:140px;">
        <label style="font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted); display:block; margin-bottom:4px;">User</label>
        <input id="filterUser" type="text" placeholder="Filter by user..." style="width:100%; padding:8px 10px; border-radius:6px; border:1px solid var(--border); background:var(--surface2); color:var(--text); font-size:13px;">
      </div>
      <div style="flex:1; min-width:140px;">
        <label style="font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted); display:block; margin-bottom:4px;">From</label>
        <input id="filterFrom" type="date" style="width:100%; padding:8px 10px; border-radius:6px; border:1px solid var(--border); background:var(--surface2); color:var(--text); font-size:13px;">
      </div>
      <div style="flex:1; min-width:140px;">
        <label style="font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted); display:block; margin-bottom:4px;">To</label>
        <input id="filterTo" type="date" style="width:100%; padding:8px 10px; border-radius:6px; border:1px solid var(--border); background:var(--surface2); color:var(--text); font-size:13px;">
      </div>
      <div>
        <button id="clearLogFilters" class="btn btn-secondary" style="padding:8px 14px; font-size:12px;">Clear</button>
      </div>
    </div>
  </div>

  <!-- Quick Filters -->
  <div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap">
    <button class="btn btn-secondary log-preset" data-preset="login_failed" style="padding:5px 12px;font-size:12px;border-radius:20px">Login Failures</button>
    <button class="btn btn-secondary log-preset" data-preset="delete" style="padding:5px 12px;font-size:12px;border-radius:20px">Deletions</button>
    <button class="btn btn-secondary log-preset" data-preset="export" style="padding:5px 12px;font-size:12px;border-radius:20px">Exports</button>
    <button class="btn btn-secondary log-preset" data-preset="create" style="padding:5px 12px;font-size:12px;border-radius:20px">Creations</button>
    <button class="btn btn-secondary log-preset" data-preset="today" style="padding:5px 12px;font-size:12px;border-radius:20px">Today</button>
    <button class="btn btn-secondary log-preset" data-preset="week" style="padding:5px 12px;font-size:12px;border-radius:20px">This Week</button>
  </div>

  <!-- Log Table -->
  <div class="card" style="padding:0; overflow:hidden;">
    <div id="logTableWrap" style="overflow-x:auto;">
      <table style="width:100%; border-collapse:collapse; min-width:800px;">
        <thead>
          <tr style="border-bottom:1px solid var(--border);">
            <th style="padding:12px 14px; text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted); white-space:nowrap;">Timestamp</th>
            <th style="padding:12px 14px; text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted);">User</th>
            <th style="padding:12px 14px; text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted);">Module</th>
            <th style="padding:12px 14px; text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted);">Action</th>
            <th style="padding:12px 14px; text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted);">Details</th>
            <th style="padding:12px 14px; text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted);">IP</th>
          </tr>
        </thead>
        <tbody id="logBody">
          <tr><td colspan="6" style="padding:40px; text-align:center; color:var(--muted);">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Pagination -->
  <div id="pagination" style="display:flex; align-items:center; justify-content:space-between; margin-top:14px; padding:0 4px;">
    <span id="pageInfo" style="font-size:12px; color:var(--muted);"></span>
    <div style="display:flex; gap:6px;">
      <button id="btnPrev" class="btn btn-secondary" style="padding:6px 12px; font-size:12px;" disabled>← Prev</button>
      <button id="btnNext" class="btn btn-secondary" style="padding:6px 12px; font-size:12px;" disabled>Next →</button>
    </div>
  </div>

</div>

<script src="/static/js/admin_logs.js" defer></script>

{% endblock %}
