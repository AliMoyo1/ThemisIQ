services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: themisiq
      POSTGRES_USER: themisiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U themisiq"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Bind to loopback only — not reachable from outside the VPS.
    ports:
      - "127.0.0.1:5432:5432"
    mem_limit: 1g
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://themisiq:${POSTGRES_PASSWORD}@db:5432/themisiq
      SECRET_KEY: ${SECRET_KEY}
      WORKERS: "2"
    env_file:
      - oneforall/.env
    volumes:
      - ./data/backups:/app/data/backups
      - ./data/grid_uploads:/app/data/grid_uploads
      - ./data/evidence:/app/data/evidence
      # PLAN-35 T05: durable ARIA storage. The Compose app previously had
      # no mount for these at all -- confirmed directly by reading this
      # file before adding these two lines -- so ARIA uploads/templates
      # and the policy-workflow artifact tree lived only inside the
      # container's own writable layer and would have been lost on any
      # container recreation. aria_preview_spool is shared with the
      # aria-preview service below; it is exchange space, not the
      # artifact archive (final files live under aria_uploads).
      - ./data/aria_uploads:/app/data/aria_uploads
      - ./data/aria_templates:/app/data/aria_templates
      - aria_preview_spool:/app/data/aria_preview_spool
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 1g
    cpus: 2
    ports:
      - "127.0.0.1:8080:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # PLAN-35 T05/7.6: ARIA policy DOCX-to-PDF conversion worker. Isolated
  # from the app: no ports, no network, no access to the database or the
  # app's .env -- exchanges jobs with the app only through the shared
  # aria_preview_spool volume. Uses an explicitly pinned image; do not
  # switch this to `:latest` or add package upgrades inside a running
  # container. Replace the image tag and re-run readiness (see this
  # service's healthcheck and generated runtime-manifest.json)
  # to update the converter; the app does not need to stop to do this.
  aria-preview:
    # Local builds use the explicit :local development tag. Production must
    # override ARIA_PREVIEW_IMAGE with the tested registry image@sha256 digest.
    image: ${ARIA_PREVIEW_IMAGE:-themisiq/aria-preview:local}
    build:
      context: .
      dockerfile: deploy/aria-preview/Dockerfile
      args:
        ARIA_PREVIEW_WORKER_BUILD_ID: ${ARIA_PREVIEW_WORKER_BUILD_ID:-local-development}
        ARIA_PREVIEW_BUILT_AT: ${ARIA_PREVIEW_BUILT_AT:-1970-01-01T00:00:00Z}
    restart: unless-stopped
    environment:
      ARIA_POLICY_PREVIEW_SPOOL_DIR: /spool
      ARIA_POLICY_PREVIEW_EXECUTABLE: soffice
      ARIA_POLICY_PREVIEW_TIMEOUT_SECONDS: "60"
    volumes:
      - aria_preview_spool:/spool
    read_only: true
    tmpfs:
      - /tmp
      - /home/ariaworker:uid=1001,gid=1001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    network_mode: none
    mem_limit: 1g
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  pgdata:
  # Private exchange space between app and aria-preview only. Not a backup
  # target: final artifacts live under the aria_uploads bind mount above,
  # this volume holds only in-flight conversion jobs.
  aria_preview_spool:
