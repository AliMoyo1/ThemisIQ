<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>ThemisIQ — Sign In</title>
  <script src="/static/js/premium_theme_init.js"></script>
  <link rel="stylesheet" href="/static/fonts/fonts.css?v=2">
  <link rel="stylesheet" href="/static/css/premium_standalone.css?v=2">
  <link rel="stylesheet" href="/static/css/login.css?v=1">
  <meta name="ph-key" content="{{ posthog_api_key }}">
  <meta name="ph-host" content="{{ posthog_host }}">
  <script defer src="/static/js/login.js?v=1"></script>
  <script defer src="/static/js/login_analytics.js?v=1"></script>
</head>
<body data-premium="login">
  <div class="login-scene" aria-hidden="true">
    <video id="loginBackground" class="login-video" muted loop playsinline preload="none"
           data-src="/static/media/login/network-1080p-v1.mp4"></video>
    <div class="login-scene-wash"></div>
  </div>

  <main class="login-layout">
    <section class="login-card" aria-labelledby="login-heading">
      <div class="login-brand">
        <div class="login-brand-mark" aria-hidden="true"></div>
        <div class="login-brand-name" aria-label="ThemisIQ">Themis<span>IQ</span></div>
      </div>

      <div class="login-intro">
        <h1 id="login-heading">Welcome back</h1>
        <p>One clear view across your governance work.</p>
      </div>

      {% if error %}
      <div class="login-error" role="alert">{{ error }}</div>
      {% endif %}

      <form method="POST" action="/login" id="loginForm">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="login-field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required autofocus
                 autocomplete="username" spellcheck="false">
        </div>
        <div class="login-field">
          <label for="password">Password</label>
          <div class="login-password-wrap">
            <input type="password" id="password" name="password" required
                   autocomplete="current-password">
            <button type="button" id="pwToggle" class="login-password-toggle"
                    aria-label="Show password" aria-pressed="false">Show</button>
          </div>
        </div>
        <div class="login-options">
          <label class="login-remember" for="rememberMe">
            <input type="checkbox" name="remember_me" id="rememberMe">
            <span>Remember me</span>
          </label>
          <a href="/forgot-password">Forgot password?</a>
        </div>
        <button type="submit" id="submitBtn" class="login-submit">
          <span class="login-submit-label">Sign in</span>
          <span class="login-spinner" aria-hidden="true"></span>
          <span class="login-submit-arrow" aria-hidden="true">→</span>
        </button>
      </form>

      <div class="login-modules" aria-label="ThemisIQ platform modules">
        <p>Connected modules</p>
        <ul>
          <li>Governance</li>
          <li>Audit</li>
          <li>Resilience</li>
          <li>Privacy</li>
          <li>Enterprise Risk</li>
          <li>Operations Risk</li>
          <li>AI Governance</li>
        </ul>
      </div>
    </section>
    <button type="button" id="bgMotionToggle" class="login-motion-toggle" hidden
            aria-label="Pause background video" aria-pressed="true">
      Pause background
    </button>
  </main>
</body>
</html>
